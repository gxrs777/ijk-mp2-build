name: Build ijk MP2

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_NDK: /home/runner/android-ndk-r14b
      ANDROID_NDK_ROOT: /home/runner/android-ndk-r14b

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        id: build
        run: |
          set -e
          sudo apt update
          sudo apt install -y git wget curl unzip yasm nasm make pkg-config autoconf libtool python3 python2 || true

          # === 修复 libncurses.so.5：用用户目录软链，不碰系统 ==-
          mkdir -p "$HOME/ndk-compat"
          ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 "$HOME/ndk-compat/libtinfo.so.5"
          ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 "$HOME/ndk-compat/libncurses.so.5"
          export LD_LIBRARY_PATH="$HOME/ndk-compat:$LD_LIBRARY_PATH"

          export PATH="$PATH:$ANDROID_NDK"
          cd "$HOME"
          if [ ! -d "$ANDROID_NDK" ]; then
            curl -L --retry 5 -o android-ndk-r14b-linux-x86_64.zip https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip
            unzip -q android-ndk-r14b-linux-x86_64.zip
          fi
          rm -rf ijkplayer-android
          git clone https://github.com/bilibili/ijkplayer ijkplayer-android
          cd ijkplayer-android
          git checkout -B latest k0.8.8
          ./init-android.sh
          cd config
          rm -f module.sh
          ln -s module-lite.sh module.sh
          cat >> module-lite.sh << 'EOF'
          export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-decoder=mp2,mp2float"
          export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-decoder=mp3,mp3float"
          export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-decoder=aac,aac_latm"
          export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-decoder=ac3,eac3"
          export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-parser=mpegaudio,aac,ac3"
          export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-demuxer=mpegts"
          export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-protocol=http,tcp,udp,rtp,hls"
          EOF
          sed -i 's/--enable-small//g' module-lite.sh
          cd ../android/contrib
          ./compile-ffmpeg.sh clean
          ./compile-ffmpeg.sh arm64
          ./compile-ffmpeg.sh armv7a
          cd ../../android
          ./compile-ijk.sh arm64
          ./compile-ijk.sh armv7a
          echo "BUILD_OK"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p /home/runner/output/arm64-v8a /home/runner/output/armeabi-v7a
          echo "=== find all .so ==="
          find "$HOME/ijkplayer-android" -name '*.so' -print || true
          echo "=== copy .so ==="
          find "$HOME/ijkplayer-android" -name '*.so' 2>/dev/null | while read f; do
            case "$f" in
              *arm64-v8a*) cp "$f" /home/runner/output/arm64-v8a/ ;;
              *armeabi-v7a*|*armv7a*) cp "$f" /home/runner/output/armeabi-v7a/ ;;
              *) echo "UNKNOWN_PATH: $f" ;;
            esac
          done
          echo "=== output contents ==="
          ls -R /home/runner/output || true
          cat > /home/runner/output/diagnostic.txt << EOF
          Build step result: ${{ steps.build.outcome }}
          If you see this file, no .so was found or copied.
          Please send the contents of this artifact back for debugging.
          EOF
          echo "COLLECT_DONE"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ijk-so
          path: /home/runner/output/
          if-no-files-found: warn

